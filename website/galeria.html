<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería · Kohlmann Banquetes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="shared.css">
<style>
  :root { --ph-h: min(50vh, 460px); }
  .galeria-section { background: var(--cream); padding: 40px 0 140px; }
  .galeria-grid {
    display: grid; grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 180px; gap: 12px; padding: 0 24px;
    max-width: 1500px; margin: 0 auto;
  }
  .galeria-grid button {
    grid-column: span 3; grid-row: span 1;
    overflow: hidden; background: var(--navy-deep);
    border: 0; padding: 0; cursor: zoom-in;
    display: block; width: 100%; height: 100%;
  }
  .galeria-grid button.tall { grid-row: span 2; }
  .galeria-grid img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: var(--image-filter);
    transition: transform 800ms cubic-bezier(.22,.61,.36,1);
  }
  .galeria-grid button:hover img { transform: scale(1.05); }

  @media (max-width: 880px) {
    .galeria-grid { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 140px; }
    .galeria-grid button, .galeria-grid button.tall { grid-column: span 3; grid-row: span 1; }
  }
</style>
</head>
<body>
  <div id="nav-root" data-current="galeria"></div>

  <main>
    <section>
      <div class="ph-photo">
        <img src="https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina30.jpg" alt="">
      </div>
      <div class="ph-text">
        <div class="ph-inner">
          <div data-ornament data-w="320"></div>
          <h1>
            <span class="ph-caps" data-i18n="ph.caps">UNA CASA DE</span>
            <span class="ph-italic" data-i18n="ph.italic">memorias</span>
          </h1>
          <p class="ph-intro" data-i18n="ph.intro">Más de cinco mil eventos. Una selección de los que más amamos — bodas, recepciones, celebraciones íntimas. Las fotografías honran la discreción de nuestros clientes; los detalles, la del oficio.</p>
        </div>
      </div>
    </section>

    <div class="reveal">
      <section class="galeria-section">
        <div class="galeria-grid" id="galeriaGrid"></div>
      </section>
    </div>
  </main>

  <div id="footer-root"></div>

  <script>
    window.I18N_EN = {
      "ph.caps": "A HOUSE OF",
      "ph.italic": "memories",
      "ph.intro": "More than five thousand events. A selection of the ones we love most — weddings, receptions, intimate celebrations. The photographs honour the discretion of our clients; the details, that of the craft."
    };
  </script>
  <script src="shared.js"></script>
  <script>
    (function () {
      var PHOTOS = [
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina5.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina15.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina19.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina30.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina5.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina15.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina19.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina30.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina5.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina19.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina30.jpg",
        "https://kohlmann.com.mx/wp-content/uploads/2025/09/Kholmann-Jardin-Santa-RIta-Cocina15.jpg"
      ];
      var TALL = { 0: true, 4: true, 7: true, 11: true };
      var grid = document.getElementById("galeriaGrid");
      PHOTOS.forEach(function (src, i) {
        var btn = document.createElement("button");
        btn.type = "button";
        if (TALL[i]) btn.className = "tall";
        btn.setAttribute("data-lightbox", src);
        var img = document.createElement("img");
        img.src = src; img.alt = ""; img.loading = "lazy";
        btn.appendChild(img);
        grid.appendChild(btn);
      });
    })();
  </script>
</body>
</html>
