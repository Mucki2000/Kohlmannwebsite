<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería · Kohlmann Banquetes</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="shared.css">
<style>
  :root { --ph-h: min(50vh, 460px); }
  .galeria-section { background: var(--cream); padding: 40px 0 140px; }
  .galeria-grid {
    display: grid; grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 220px; gap: 12px; padding: 0 24px;
    grid-auto-flow: dense;
    max-width: 1500px; margin: 0 auto;
  }
  .galeria-grid button {
    grid-column: span 3; grid-row: span 1;
    overflow: hidden; background: var(--navy-deep);
    border: 0; padding: 0; cursor: zoom-in;
    display: block; width: 100%; height: 100%;
  }
  .galeria-grid button.tall    { grid-row: span 2; }
  .galeria-grid button.wide    { grid-column: span 6; }
  .galeria-grid button.feature { grid-column: span 6; grid-row: span 2; }
  .galeria-grid img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: var(--image-filter);
    transition: transform 800ms cubic-bezier(.22,.61,.36,1);
  }
  .galeria-grid button:hover img { transform: scale(1.05); }

  @media (max-width: 1100px) {
    .galeria-grid { grid-auto-rows: 190px; }
  }
  @media (max-width: 880px) {
    .galeria-grid { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 160px; }
    .galeria-grid button,
    .galeria-grid button.tall,
    .galeria-grid button.wide,
    .galeria-grid button.feature { grid-column: span 3; grid-row: span 1; }
  }
</style>
</head>
<body>
  <div id="nav-root" data-current="galeria"></div>

  <main>
    <section>
      <div class="ph-photo">
        <img src="assets/gallery/1.png" alt="">
      </div>
      <div class="ph-text">
        <div class="ph-inner">
          <div data-ornament data-w="320"></div>
          <h1>
            <span class="ph-caps" data-i18n="ph.caps">UNA GALERÍA DE</span>
            <span class="ph-italic" data-i18n="ph.italic">momentos</span>
          </h1>
          <p class="ph-intro" data-i18n="ph.intro">Una selección de los eventos que hemos tenido el privilegio de organizar. Las fotografías respetan la discreción de nuestros clientes. Los detalles hablan por sí solos.</p>
        </div>
      </div>
    </section>

    <div class="reveal">
      <section class="galeria-section">
        <div class="galeria-grid" id="galeriaGrid"></div>
      </section>
    </div>
  </main>

  <div id="footer-root"></div>

  <script>
    window.I18N_EN = {
      "ph.caps": "A GALLERY OF",
      "ph.italic": "moments",
      "ph.intro": "A selection of the events we have had the privilege of organising. The photographs respect the discretion of our clients. The details speak for themselves."
    };
  </script>
  <script src="shared.js"></script>
  <script>
    (function () {
      var PHOTOS = [
        "assets/gallery/1.png",  "assets/gallery/2.png",  "assets/gallery/3.png",  "assets/gallery/4.png",
        "assets/gallery/5.jpg",  "assets/gallery/6.jpg",  "assets/gallery/7.png",  "assets/gallery/8.png",
        "assets/gallery/9.png",  "assets/gallery/10.png", "assets/gallery/11.png", "assets/gallery/12.png",
        "assets/gallery/13.png", "assets/gallery/14.png", "assets/gallery/15.png", "assets/gallery/16.png",
        "assets/gallery/17.png", "assets/gallery/18.png", "assets/gallery/19.png", "assets/gallery/19.1.png",
        "assets/gallery/20.png", "assets/gallery/21.png", "assets/gallery/22.png", "assets/gallery/23.png",
        "assets/gallery/24.png", "assets/gallery/25.png", "assets/gallery/26.png"
      ];
      var SHAPES = {
        0:  "feature",
        7:  "wide",
        17: "tall"
      };
      var grid = document.getElementById("galeriaGrid");
      PHOTOS.forEach(function (src, i) {
        var btn = document.createElement("button");
        btn.type = "button";
        if (SHAPES[i]) btn.className = SHAPES[i];
        btn.setAttribute("data-lightbox", src);
        var img = document.createElement("img");
        img.src = src; img.alt = ""; img.loading = "lazy";
        btn.appendChild(img);
        grid.appendChild(btn);
      });
    })();
  </script>
</body>
</html>
